<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Libros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos básicos para la app, si los necesitas. Tailwind lo hace casi todo. */
        /* Estos son solo por si acaso, Tailwind me ayuda mucho a no escribir CSS. */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 1200px;
        }
        /* Clase para el botón de eliminar, si quieres un estilo más específico o no usas btn-danger de bootstrap */
        .btn-danger {
            background-color: #dc3545; /* Color rojo de Bootstrap */
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="container bg-white shadow-lg rounded-lg p-8 space-y-8 w-full">

        <h1 class="text-4xl font-bold text-center text-blue-700 mb-8">Gestión de Libros</h1>

        <div id="message-container" class="hidden p-3 rounded-md text-sm" role="alert"></div>

        <div id="auth-section" class="space-y-6">
            <h2 class="text-2xl font-semibold text-gray-800 text-center">Bienvenido</h2>
            
            <div class="flex justify-center space-x-4">
                <button id="show-login-btn" class="px-6 py-2 bg-blue-500 text-white font-semibold rounded-md shadow hover:bg-blue-600 transition duration-300">Iniciar Sesión</button>
                <button id="show-register-btn" class="px-6 py-2 bg-green-500 text-white font-semibold rounded-md shadow hover:bg-green-600 transition duration-300">Registrarse</button>
            </div>

            <form id="login-form" class="hidden bg-white p-6 rounded-lg shadow-md space-y-4 max-w-md mx-auto">
                <h3 class="text-xl font-medium text-gray-700 text-center">Iniciar Sesión</h3>
                <div>
                    <label for="login-email" class="block text-sm font-medium text-gray-700">Email:</label>
                    <input type="email" id="login-email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-700">Contraseña:</label>
                    <input type="password" id="login-password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Login</button>
            </form>

            <form id="register-form" class="hidden bg-white p-6 rounded-lg shadow-md space-y-4 max-w-md mx-auto">
                <h3 class="text-xl font-medium text-gray-700 text-center">Registrarse</h3>
                <div>
                    <label for="register-name" class="block text-sm font-medium text-gray-700">Nombre:</label>
                    <input type="text" id="register-name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="register-email" class="block text-sm font-medium text-gray-700">Email:</label>
                    <input type="email" id="register-email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="register-password" class="block text-sm font-medium text-gray-700">Contraseña:</label>
                    <input type="password" id="register-password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm" required>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">Registrarse</button>
            </form>
        </div>

        <div id="app-section" class="hidden space-y-8">
            <h2 class="text-2xl font-semibold text-gray-800 text-center">Bienvenido a la Gestión de Libros</h2>
            <button id="logout-btn" class="block ml-auto px-4 py-2 bg-red-500 text-white font-semibold rounded-md shadow hover:bg-red-600 transition duration-300">Cerrar Sesión</button>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-medium text-gray-700 mb-4">Añadir Nuevo Libro</h3>
                <form id="create-book-form" class="space-y-4">
                    <div>
                        <label for="book-title" class="block text-sm font-medium text-gray-700">Título:</label>
                        <input type="text" id="book-title" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    </div>
                    <div>
                        <label for="book-author" class="block text-sm font-medium text-gray-700">Autor:</label>
                        <input type="text" id="book-author" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    </div>
                    <div>
                        <label for="book-genre" class="block text-sm font-medium text-gray-700">Género:</label>
                        <input type="text" id="book-genre" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    </div>
                    <div>
                        <label for="book-price" class="block text-sm font-medium text-gray-700">Precio:</label>
                        <input type="number" id="book-price" step="0.01" min="0" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    </div>
                    <div>
                        <label for="book-stock" class="block text-sm font-medium text-gray-700">Stock:</label>
                        <input type="number" id="book-stock" min="1" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Añadir Libro</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-medium text-gray-700 mb-4">Libros Disponibles</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Título</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Autor</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Género</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Precio</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Stock</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th> </tr>
                        </thead>
                        <tbody id="books-table-body" class="bg-white divide-y divide-gray-200">
                            </tbody>
                    </table>
                </div>
                <button id="refresh-books-btn" class="mt-4 px-4 py-2 bg-purple-500 text-white font-semibold rounded-md shadow hover:bg-purple-600 transition duration-300">Actualizar Libros</button>
            </div>

        </div>
    </div>

    <script>
        // Esta es la URL base de mi API Go. ¡Es crucial que coincida con el puerto donde está corriendo mi servidor Go!
        const API_BASE_URL = 'http://localhost:8080';
        // Aquí guardo el token JWT. Primero intento recuperarlo del almacenamiento local del navegador, por si ya había iniciado sesión.
        let authToken = localStorage.getItem('jwtToken');

        // Referencias a los elementos HTML principales que voy a manipular. Así no tengo que buscarlos cada vez.
        const authSection = document.getElementById('auth-section'); // La sección para login/registro
        const appSection = document.getElementById('app-section');    // La sección principal de la app
        const messageContainer = document.getElementById('message-container'); // Para mostrar mensajes (éxito, error, etc.)

        // Referencias a los formularios y botones de autenticación.
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const showLoginBtn = document.getElementById('show-login-btn');
        const showRegisterBtn = document.getElementById('show-register-btn');
        const logoutBtn = document.getElementById('logout-btn'); // Botón para cerrar sesión

        // Referencias a los elementos relacionados con la gestión de libros.
        const createBookForm = document.getElementById('create-book-form'); // Formulario para crear libros
        const booksTableBody = document.getElementById('books-table-body'); // El cuerpo de la tabla donde irán mis libros
        const refreshBooksBtn = document.getElementById('refresh-books-btn'); // Botón para recargar la lista de libros

        // Función para mostrar mensajes al usuario. Me ayuda a dar feedback visual de lo que está pasando.
        function showMessage(message, type = 'info') {
            messageContainer.textContent = message; // Pongo el texto del mensaje
            // Quito todas las clases de color y la de ocultar para empezar de cero.
            messageContainer.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');
            // Añado clases de color según el tipo de mensaje (error, éxito, info).
            if (type === 'error') {
                messageContainer.classList.add('bg-red-100', 'text-red-700');
            } else if (type === 'success') {
                messageContainer.classList.add('bg-green-100', 'text-green-700');
            } else {
                messageContainer.classList.add('bg-blue-100', 'text-blue-700');
            }
            messageContainer.classList.remove('hidden'); // ¡Lo hago visible!
            // Después de 5 segundos, lo vuelvo a ocultar.
            setTimeout(() => {
                messageContainer.classList.add('hidden');
            }, 5000);
        }

        // Esta función decide qué parte de la app mostrar: la de autenticación o la de gestión de libros.
        function toggleAppVisibility() {
            if (authToken) { // Si tengo un token, significa que estoy logueado.
                authSection.classList.add('hidden');    // Oculto la sección de autenticación.
                appSection.classList.remove('hidden');  // Muestro la sección principal de la app.
                loadBooks(); // ¡Y cargo los libros automáticamente!
            } else { // Si no tengo token, no estoy logueado.
                authSection.classList.remove('hidden'); // Muestro la sección de autenticación.
                appSection.classList.add('hidden');     // Oculto la app principal.
                loginForm.classList.remove('hidden');   // Por defecto, muestro el formulario de login.
                registerForm.classList.add('hidden');   // Y oculto el de registro.
            }
        }

        // --- Manejo de Autenticación ---

        // Cuando hago clic en "Iniciar Sesión", muestro ese formulario y oculto el de registro.
        showLoginBtn.addEventListener('click', () => {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        });

        // Cuando hago clic en "Registrarse", muestro ese formulario y oculto el de login.
        showRegisterBtn.addEventListener('click', () => {
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        // ¡Manejar el envío del formulario de registro!
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Evito que el formulario se envíe de la forma tradicional (para que JavaScript lo maneje).
            // Obtengo los valores de los campos.
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            try {
                // Hago una solicitud POST a mi API Go para registrar el usuario.
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }, // ¡Importante! Le digo al servidor que le envío JSON.
                    body: JSON.stringify({ name, email, password }) // Convierto mis datos a JSON para enviarlos.
                });
                // Espero la respuesta y la parseo como JSON. ¡Por eso mi backend debe devolver siempre JSON!
                const data = await response.json();
                if (response.ok) { // Si la respuesta fue exitosa (código 2xx)
                    showMessage(data.message || 'Registro exitoso. ¡Ahora puedes iniciar sesión!', 'success');
                    registerForm.reset(); // Limpio el formulario de registro.
                    loginForm.classList.remove('hidden'); // Muestro el formulario de login para que pueda iniciar sesión.
                    registerForm.classList.add('hidden'); // Oculto el de registro.
                } else { // Si hubo un error en la respuesta de la API.
                    showMessage(data.message || 'Error en el registro', 'error'); // Muestro el mensaje de error que vino del backend.
                }
            } catch (error) {
                // Si hay un problema de red o algo grave que impida la comunicación con la API.
                showMessage('Error de red al registrar: ' + error.message, 'error');
            }
        });

        // ¡Manejar el envío del formulario de inicio de sesión!
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                // Hago una solicitud POST a mi API Go para iniciar sesión.
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok && data.token) { // Si la respuesta fue exitosa Y me devolvió un token.
                    authToken = data.token; // Guardo el token en mi variable.
                    localStorage.setItem('jwtToken', authToken); // ¡Lo guardo también en el almacenamiento local para que persista!
                    showMessage('Inicio de sesión exitoso', 'success');
                    loginForm.reset(); // Limpio el formulario de login.
                    toggleAppVisibility(); // ¡Muestro la aplicación principal!
                } else {
                    showMessage(data.message || 'Error al iniciar sesión. Credenciales inválidas.', 'error');
                }
            } catch (error) {
                showMessage('Error de red al iniciar sesión: ' + error.message, 'error');
            }
        });

        // ¡Manejar el clic en el botón de cerrar sesión!
        logoutBtn.addEventListener('click', () => {
            authToken = null; // Elimino el token de mi variable en JavaScript.
            localStorage.removeItem('jwtToken'); // ¡Lo más importante: lo borro del almacenamiento local!
            showMessage('Sesión cerrada correctamente', 'info');
            toggleAppVisibility(); // Vuelvo a mostrar la vista de autenticación.
            booksTableBody.innerHTML = ''; // Limpio la tabla de libros por si acaso.
        });


        // --- Manejo de Libros ---

        // Función asíncrona para cargar y mostrar los libros.
        async function loadBooks() {
            if (!authToken) { // Primero, me aseguro de tener un token. Si no, no puedo cargar libros.
                showMessage('No autenticado. Por favor, inicie sesión para ver los libros.', 'error');
                return;
            }
            try {
                // Hago una solicitud GET a mi API Go para obtener los libros.
                const response = await fetch(`${API_BASE_URL}/books`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}` // ¡Envío mi token JWT en el encabezado de autorización!
                    }
                });
                const books = await response.json(); // Espero la respuesta y la parseo como JSON.
                
                if (response.ok) { // Si todo salió bien.
                    booksTableBody.innerHTML = ''; // Limpio la tabla antes de agregar los nuevos libros.
                    if (books.length === 0) { // Si no hay libros, muestro un mensaje.
                        booksTableBody.innerHTML = '<tr><td colspan="7" class="px-6 py-4 whitespace-nowrap text-center text-gray-500">No hay libros disponibles.</td></tr>';
                        // NOTA: colspan ahora es 7 porque añadimos una columna de "Acciones"
                        return;
                    }
                    // Itero sobre cada libro que recibo y creo una fila en la tabla para él.
                    books.forEach(book => {
                        const row = booksTableBody.insertRow(); // Usamos insertRow para mayor control y para añadir el event listener
                        row.insertCell(0).classList.add('px-6', 'py-4', 'whitespace-nowrap');
                        row.insertCell(0).textContent = book.id;
                        row.insertCell(1).classList.add('px-6', 'py-4', 'whitespace-nowrap');
                        row.insertCell(1).textContent = book.title;
                        row.insertCell(2).classList.add('px-6', 'py-4', 'whitespace-nowrap');
                        row.insertCell(2).textContent = book.author;
                        row.insertCell(3).classList.add('px-6', 'py-4', 'whitespace-nowrap');
                        row.insertCell(3).textContent = book.genre;
                        row.insertCell(4).classList.add('px-6', 'py-4', 'whitespace-nowrap');
                        row.insertCell(4).textContent = `$${book.price.toFixed(2)}`;
                        row.insertCell(5).classList.add('px-6', 'py-4', 'whitespace-nowrap');
                        row.insertCell(5).textContent = book.stock;

                        // ¡NUEVA CELDA PARA EL BOTÓN DE ELIMINAR!
                        const actionsCell = row.insertCell(6);
                        actionsCell.classList.add('px-6', 'py-4', 'whitespace-nowrap', 'text-right', 'text-sm', 'font-medium'); // Tailwind classes
                        const deleteButton = document.createElement('button');
                        deleteButton.textContent = 'Eliminar';
                        deleteButton.classList.add('btn-danger', 'btn-sm'); // Clases para el estilo del botón
                        deleteButton.dataset.id = book.id; // Almacenar el ID del libro

                        // Añadir el listener para el botón de eliminar
                        deleteButton.addEventListener('click', handleDeleteBook);
                        actionsCell.appendChild(deleteButton);
                    });
                    showMessage('Libros cargados exitosamente', 'success'); // Mensaje de éxito.
                } else { // Si hubo un error al cargar los libros.
                    showMessage(books.message || 'Error al cargar los libros', 'error');
                    // Si el servidor me dice que mi token es inválido o expiró (código 401 Unauthorized), fuerzo el cierre de sesión.
                    if (response.status === 401) {
                         showMessage('Sesión expirada o inválida. Por favor, inicie sesión de nuevo.', 'error');
                         logoutBtn.click(); // Simulo un clic en el botón de cerrar sesión.
                    }
                }
            } catch (error) {
                // Error de red o comunicación al intentar cargar libros.
                showMessage('Error de red al cargar libros: ' + error.message, 'error');
            }
        }

        // --- NUEVA FUNCIÓN: handleDeleteBook ---
        async function handleDeleteBook(event) {
            // Obtener el ID del libro desde el atributo data-id del botón
            const bookId = event.target.dataset.id;

            // Confirmación al usuario antes de eliminar
            if (!confirm(`¿Estás seguro de que quieres eliminar el libro con ID ${bookId}?`)) {
                return; // Si el usuario cancela, no hacemos nada
            }

            try {
                const response = await fetch(`${API_BASE_URL}/books/${bookId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}` // Es crucial enviar el token JWT
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message || 'Libro eliminado exitosamente.', 'success');
                    // Si la eliminación fue exitosa, volvemos a cargar la lista de libros
                    loadBooks(); // Ahora se llama a loadBooks()
                } else {
                    // Manejar errores (ej. libro no encontrado, error del servidor)
                    showMessage(data.message || 'Error al eliminar el libro.', 'danger');
                    if (response.status === 401) {
                         showMessage('Sesión expirada o inválida. Por favor, inicie sesión de nuevo.', 'error');
                         logoutBtn.click();
                    }
                }
            } catch (error) {
                console.error('Error en la solicitud de eliminación:', error);
                showMessage('Error de conexión al intentar eliminar el libro.', 'danger');
            }
        }

        // Manejar el envío del formulario para crear un nuevo libro.
        createBookForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!authToken) { // De nuevo, necesito estar autenticado para crear libros.
                showMessage('No autenticado. Por favor, inicie sesión para crear libros.', 'error');
                return;
            }

            // Obtengo los valores de los campos del formulario de creación de libros.
            const title = document.getElementById('book-title').value;
            const author = document.getElementById('book-author').value;
            const genre = document.getElementById('book-genre').value;
            const price = parseFloat(document.getElementById('book-price').value); // Convierto a número flotante.
            const stock = parseInt(document.getElementById('book-stock').value); // Convierto a número entero.

            // Validación básica en el frontend para que no envíe datos vacíos o incorrectos.
            if (!title || !author || !genre || isNaN(price) || price <= 0 || isNaN(stock) || stock <= 0) {
                showMessage('Por favor, complete todos los campos y asegúrese de que Precio y Stock sean valores válidos y positivos.', 'error');
                return;
            }

            try {
                // Hago una solicitud POST a mi API Go para crear un libro.
                const response = await fetch(`${API_BASE_URL}/books/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}` // ¡Envío mi token JWT aquí también!
                    },
                    body: JSON.stringify({ title, author, genre, price, stock }) // Convierto mis datos a JSON.
                });
                const data = await response.json(); // Espero la respuesta y la parseo.
                if (response.ok) { // Si la creación fue exitosa.
                    showMessage(data.message || 'Libro creado exitosamente', 'success');
                    createBookForm.reset(); // Limpio el formulario de creación.
                    loadBooks(); // ¡Vuelvo a cargar la lista de libros para ver el nuevo!
                } else { // Si hubo un error en la API al crear el libro.
                    showMessage(data.message || 'Error al crear el libro', 'error');
                    if (response.status === 401) { // Si el token es inválido aquí también, cierro la sesión.
                         showMessage('Sesión expirada o inválida. Por favor, inicie sesión de nuevo.', 'error');
                         logoutBtn.click();
                    }
                }
            } catch (error) {
                // Error de red al intentar crear el libro.
                showMessage('Error de red al crear libro: ' + error.message, 'error');
            }
        });

        // Cuando hago clic en el botón de "Actualizar Libros", simplemente llamo a la función loadBooks para recargarlos.
        refreshBooksBtn.addEventListener('click', loadBooks);

        // --- Inicialización ---
        // Cuando el documento HTML esté completamente cargado, llamo a 'toggleAppVisibility'.
        // Esto es para que la app decida si mostrar la sección de login o la principal al cargar la página.
        document.addEventListener('DOMContentLoaded', toggleAppVisibility);
    </script>
</body>
</html>
